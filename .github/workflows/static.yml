# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies 
        run: |
           npm install eslint stylelint stylelint-config-standard htmlhint --save-dev
           npm install
             
      - name: Create ESLint config
        run: |
          echo "export default [{" > eslint.config.js
          echo "files: ['**/*.js']," >> eslint.config.js
          echo "languageOptions: { ecmaVersion: 'latest', sourceType: 'module' }," >> eslint.config.js
          echo "rules: { 'semi': ['error', 'always'], 'quotes': ['error', 'double'] }" >> eslint.config.js
          echo "}];" >> eslint.config.js

      - name: Create Stylelint config
        run: |
          echo '{' > .stylelintrc.json
          echo '  "extends": "stylelint-config-standard",' >> .stylelintrc.json
          echo '  "rules": {' >> .stylelintrc.json
          echo '    "indentation": 2,' >> .stylelintrc.json
          echo '    "string-quotes": "double"' >> .stylelintrc.json
          echo '  }' >> .stylelintrc.json
          echo '}' >> .stylelintrc.json



      - name: Run stylelint
        run: npx stylelint styles.css

      - name: Run HTMLhint
        run: npx htmlhint index.html

        
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
       
